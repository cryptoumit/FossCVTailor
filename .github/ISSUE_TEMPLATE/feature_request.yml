name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Issues are public. Do not include your CV, cover letter, contact details, employer information, or workspace backups. Describe the need without sharing private data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the task or limitation you encounter.
      placeholder: When I ..., I have trouble with ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or workflow you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or other approaches you have considered.
  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - CV editing or templates
        - Cover letters
        - Job application tracker
        - Import, backup, or export
        - Accessibility or usability
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this request contains no personal or private workspace data.
          required: true
