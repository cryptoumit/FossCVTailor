name: Bug report
description: Report a reproducible problem with CVTailor.
title: "[Bug]: "
labels: bug
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CVTailor. Issues are public. Do not include your CV, cover letter, contact details, employer information, or workspace backups. Share only the minimum information needed to reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the problem.
      placeholder: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the actions that lead to the problem. Use fictional/sample content where possible.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Include your operating system if it may be relevant.
      placeholder: e.g. Firefox 135 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error messages
      description: Optional. Remove names, email addresses, URLs, or any CV/workspace content before sharing.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no personal or private workspace data.
          required: true
